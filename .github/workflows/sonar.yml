name: Quality Gate - SonarCloud
on:
  push:
    branches: [ "main" ]
jobs:
  sonarcloud:
    name: Analisis SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Analisis
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITH_TOKEN: ${{secrets.GITHUB_TOKEN_TOKEN}}
          SONAR_TOKEN: ${{secrets.SONAR_TOKEN}}
         with:
          arg: >
            -Dsonar.organization=Daniers Solarte
            -Dsonar:proyectKey=solartedaniers_Laboratorio_Sonar
